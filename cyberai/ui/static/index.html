<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<title>CERBERUS — COMMAND DECK</title>
<style>
  /* ============ DARK CYBERSECURITY THEME ============ */
  :root {
    --bg: #05070d;
    --bg-panel: #0a0f1a;
    --bg-panel-2: #0e1626;
    --ink: #c8d6e5;
    --ink-dim: #5a6b85;
    --ink-bright: #e8f0fe;
    --neon-green: #00ff9c;
    --neon-red: #ff3b5c;
    --neon-amber: #ffb020;
    --neon-cyan: #00d4ff;
    --neon-purple: #9d4dff;
    --border: 1px solid #1e2b45;
    --border-glow: 1px solid rgba(0, 255, 156, 0.45);
    --mono: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
    --shadow-glow: 0 0 18px rgba(0, 255, 156, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(0, 212, 255, 0.08), transparent 60%),
      radial-gradient(1000px 500px at 10% 110%, rgba(157, 77, 255, 0.08), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    padding: 16px;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0, 255, 156, 0.025) 2px 4px);
  }
  .wrap { position: relative; z-index: 1; }
  /* ============ TOP BAR ============ */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: var(--border);
    border-top: 2px solid var(--neon-green);
    padding: 10px 16px; margin-bottom: 14px;
    box-shadow: var(--shadow-glow);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: 3px; color: var(--ink-bright); font-size: 19px; }
  .logo .dog-head { font-size: 26px; filter: drop-shadow(0 0 6px rgba(255, 176, 32, 0.6)); }
  .logo .accent { color: var(--neon-green); }
  .stat-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    background: var(--bg-panel); color: var(--ink);
    border: var(--border); border-radius: 4px;
    padding: 4px 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
  }
  .stat b { color: var(--neon-green); }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0, 255, 156, 0.08);
    border: 1px solid rgba(0, 255, 156, 0.5);
    border-radius: 4px; color: var(--neon-green);
    padding: 5px 12px; font-weight: 900; font-size: 12px; letter-spacing: 2px;
  }
  .status-light { width: 9px; height: 9px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  /* ============ GRID ============ */
  .grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; }
  .panel {
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: var(--border); border-radius: 6px; margin-bottom: 14px;
    overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0, 255, 156, 0.06);
    border-bottom: var(--border);
    padding: 8px 14px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; font-size: 12px; color: var(--ink-bright);
  }
  .panel-header .hint { color: var(--ink-dim); font-weight: 400; letter-spacing: 1px; text-transform: none; font-size: 11px; }
  .panel-body { padding: 14px; }
  /* ============ LAUNCHER ============ */
  .label { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; color: var(--ink-dim); margin-bottom: 6px; display: block; }
  textarea.objective {
    width: 100%; min-height: 78px; resize: vertical;
    background: #02040a; color: var(--ink-bright);
    border: var(--border); border-radius: 4px;
    font-family: var(--mono); font-size: 14px; padding: 10px;
    caret-color: var(--neon-green);
  }
  textarea.objective:focus { outline: none; border-color: var(--neon-green); box-shadow: 0 0 0 1px rgba(0,255,156,.3); }
  textarea.objective::placeholder { color: #2c3a52; }
  .mode-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .target-select {
    flex: 1; min-width: 170px;
    background: #02040a; color: var(--ink); border: var(--border); border-radius: 4px;
    font-family: var(--mono); padding: 9px 10px;
  }
  .target-select:focus { outline: none; border-color: var(--neon-green); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 900; letter-spacing: 1px; cursor: pointer; user-select: none; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--neon-green); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 4px; border: 1px solid;
    font-family: var(--mono); font-weight: 900; font-size: 14px; letter-spacing: 2px;
    text-transform: uppercase; padding: 11px 16px; cursor: pointer;
    transition: box-shadow .12s, background .12s;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-launch {
    width: 100%; margin-top: 2px;
    background: rgba(0, 255, 156, 0.1); color: var(--neon-green);
    border-color: rgba(0, 255, 156, 0.6);
  }
  .btn-launch:hover:not(:disabled) { background: rgba(0, 255, 156, 0.2); box-shadow: 0 0 16px rgba(0,255,156,.25); }
  .btn-stop { background: rgba(255, 59, 92, 0.1); color: var(--neon-red); border-color: rgba(255,59,92,.6); }
  .btn-stop:hover:not(:disabled) { background: rgba(255,59,92,.2); }
  .btn-cmd { background: rgba(0, 212, 255, 0.08); color: var(--neon-cyan); border-color: rgba(0,212,255,.5); }
  .btn-cmd:hover { background: rgba(0,212,255,.16); }
  .btn-row { display: flex; gap: 8px; }
  /* ============ COMMAND BOX ============ */
  .cmd-form { display: flex; gap: 8px; }
  .cmd-input {
    flex: 1; background: #02040a; color: var(--ink-bright);
    border: var(--border); border-radius: 4px;
    font-family: var(--mono); font-size: 13px; padding: 10px;
    caret-color: var(--neon-cyan);
  }
  .cmd-input:focus { outline: none; border-color: var(--neon-cyan); }
  .cmd-reply {
    margin-top: 10px; white-space: pre-wrap;
    background: #01030a; color: var(--neon-green);
    border: 1px solid rgba(0,255,156,.3); border-radius: 4px;
    padding: 12px; font-size: 12px; line-height: 1.6; display: none;
  }
  .cmd-reply.show { display: block; }
  /* ============ FEED ============ */
  .feed { display: flex; flex-direction: column; gap: 6px; max-height: 400px; overflow-y: auto; padding-right: 4px; }
  .feed::-webkit-scrollbar { width: 8px; }
  .feed::-webkit-scrollbar-thumb { background: #1e2b45; border-radius: 4px; }
  .feed-msg {
    display: flex; gap: 8px; align-items: flex-start;
    background: rgba(14, 22, 38, 0.7);
    border: var(--border); border-left-width: 3px; border-radius: 4px;
    padding: 8px 10px; font-size: 12px;
    animation: slidein .16s ease;
  }
  @keyframes slidein { from { transform: translateY(-5px); opacity: 0; } to { transform: none; opacity: 1; } }
  .feed-msg .icon { flex-shrink: 0; }
  .feed-msg .txt { flex: 1; }
  .feed-msg .lbl { font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
  .feed-msg .ts { flex-shrink: 0; color: var(--ink-dim); font-size: 10px; }
  .feed-msg.agent_started { border-left-color: var(--neon-cyan); }
  .feed-msg.agent_completed { border-left-color: var(--neon-green); }
  .feed-msg.task_started { border-left-color: var(--neon-amber); }
  .feed-msg.plan_ready { border-left-color: var(--neon-amber); }
  .feed-msg.phase { border-left-color: var(--neon-purple); }
  .feed-msg.task_completed { border-left-color: var(--neon-green); background: rgba(0,255,156,.07); }
  .feed-msg.task_result { border-left-color: var(--neon-green); }
  .feed-msg.task_error { border-left-color: var(--neon-red); background: rgba(255,59,92,.08); }
  .feed-msg.ready { border-left-color: var(--ink-dim); color: var(--ink-dim); }
  .feed-summary {
    margin-top: 10px; white-space: pre-wrap;
    background: #01030a; color: var(--neon-green);
    border: 1px solid rgba(0,255,156,.3); border-radius: 4px;
    padding: 12px; font-size: 12px; line-height: 1.6;
  }
  /* ============ ROSTER ============ */
  .roster { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .agent-card {
    display: flex; align-items: center; gap: 8px;
    background: rgba(14,22,38,.6); border: var(--border); border-radius: 4px;
    padding: 8px; font-size: 12px;
  }
  .agent-card .icon { font-size: 20px; }
  .agent-card .name { font-weight: 900; text-transform: uppercase; color: var(--ink-bright); }
  .agent-card .role { color: var(--ink-dim); font-size: 10px; }
  .agent-card.active { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,212,255,.2); }
  .agent-card.done { border-color: rgba(0,255,156,.5); }
  /* ============ CHIPS ============ */
  .chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: rgba(14,22,38,.7); color: var(--ink);
    border: var(--border); border-radius: 3px;
    padding: 4px 9px; font-size: 11px; font-weight: 700;
  }
  .chip.allow { color: var(--neon-green); border-color: rgba(0,255,156,.4); }
  .chip.deny { color: var(--neon-red); border-color: rgba(255,59,92,.4); }
  .chip.model-chip { color: var(--neon-cyan); border-color: rgba(0,212,255,.35); }
  .chip.tool-chip { color: var(--neon-amber); border-color: rgba(255,176,32,.35); }
  /* ============ KPI GRID (AI CONTEXT) ============ */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi {
    background: rgba(14,22,38,.6); border: var(--border); border-radius: 4px; padding: 8px 10px;
  }
  .kpi .k { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-dim); }
  .kpi .v { font-weight: 900; font-size: 16px; color: var(--ink-bright); margin-top: 2px; }
  /* ============ HISTORY LISTS ============ */
  .history-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .history-list::-webkit-scrollbar { width: 8px; }
  .history-list::-webkit-scrollbar-thumb { background: #1e2b45; border-radius: 4px; }
  .hist-item { background: rgba(14,22,38,.6); border: var(--border); border-radius: 4px; padding: 8px; font-size: 11px; }
  .hist-item .hdr { font-weight: 900; text-transform: uppercase; color: var(--neon-purple); display: flex; justify-content: space-between; gap: 8px; }
  .hist-item .sub { color: var(--ink-dim); margin-top: 2px; }
  /* ============ CAPABILITY / CONTEXT LISTS ============ */
  .ctx-list { display: flex; flex-direction: column; gap: 4px; }
  .ctx-item {
    display: flex; justify-content: space-between; gap: 8px;
    background: rgba(14,22,38,.5); border: var(--border); border-radius: 3px;
    padding: 4px 8px; font-size: 11px;
  }
  .ctx-item .k { color: var(--ink-bright); font-weight: 700; }
  .ctx-item .v { color: var(--neon-cyan); font-size: 10px; text-align: right; }
  .collapse { margin-top: 8px; }
  .collapse details { background: rgba(14,22,38,.5); border: var(--border); border-radius: 4px; margin-top: 6px; }
  .collapse summary { cursor: pointer; padding: 8px 10px; font-weight: 900; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-bright); }
  .collapse summary:hover { color: var(--neon-green); }
  .collapse .inner { padding: 8px 10px; border-top: var(--border); max-height: 220px; overflow-y: auto; }
  .kv { font-size: 11px; padding: 3px 0; border-bottom: 1px dashed #16233b; display: flex; gap: 8px; }
  .kv .k { color: var(--ink-dim); min-width: 140px; }
  .kv .v { color: var(--ink); word-break: break-all; }
  /* ============ RESPONSIVE ============ */
  @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } .roster { grid-template-columns: 1fr; } }
  @media (max-width: 540px) { body { padding: 8px; } .stat-row { display: none; } .kpi-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

<!-- ======== TOP BAR ======== -->
<header class="topbar">
  <div class="logo"><span class="dog-head">🐕</span><span>CERBERUS<span class="accent">//</span>DECK</span></div>
  <div class="stat-row">
    <span class="stat">AGENTS <b id="stat-agents">7</b></span>
    <span class="stat">TOOLS <b id="stat-tools">0</b></span>
    <span class="stat">TARGETS <b id="stat-targets">0</b></span>
    <span class="stat">MEM <b id="stat-memory">0</b></span>
    <span class="stat">CAPS <b id="stat-caps">0</b></span>
  </div>
  <span class="status-pill"><span class="status-light"></span><span id="status-text">ONLINE</span></span>
</header>

<main class="grid">
  <!-- ======== LEFT COLUMN ======== -->
  <section>
    <!-- TASK LAUNCHER -->
    <div class="panel">
      <div class="panel-header"><span>⚡ TASK LAUNCHER</span><span class="hint">ONE AI · SEVEN AGENTS</span></div>
      <div class="panel-body">
        <label class="label" for="objective">> OBJECTIVE</label>
        <textarea id="objective" class="objective" placeholder="e.g. Analyze the lab-web-01 target for SQL injection vulnerabilities"></textarea>
        <div class="mode-row">
          <select id="target-select" class="target-select"><option value="">auto-target (simulation)</option></select>
          <label class="toggle"><input type="checkbox" id="simulate" checked><span>SIMULATE</span></label>
        </div>
        <button id="btn-launch" class="btn btn-launch">🚀 LAUNCH TASK</button>
        <div class="btn-row" style="margin-top:8px">
          <button id="btn-stop" class="btn btn-stop" disabled style="flex:1">■ STOP</button>
        </div>
      </div>
    </div>

    <!-- COMMAND BOX -->
    <div class="panel">
      <div class="panel-header"><span>⌨️ OPERATOR CONSOLE</span><span class="hint">local interpreter</span></div>
      <div class="panel-body">
        <form id="cmd-form" class="cmd-form" autocomplete="off">
          <input id="cmd-input" class="cmd-input" type="text"
                 placeholder="help · status · targets · tools · models · simulate <objective>">
          <button class="btn btn-cmd" type="submit">SEND</button>
        </form>
        <div id="cmd-reply" class="cmd-reply"></div>
      </div>
    </div>

    <!-- AGENT ROSTER -->
    <div class="panel">
      <div class="panel-header"><span>🤖 AGENT SWARM</span><span id="active-count" class="hint">0 ACTIVE</span></div>
      <div class="panel-body"><div id="roster" class="roster"></div></div>
    </div>

    <!-- AI CONTEXT: EVOLUTION + CAPABILITIES + PERFORMANCE -->
    <div class="panel">
      <div class="panel-header"><span>🧬 AI CONTEXT — INTERNAL STATE</span><span class="hint">what the AI knows</span></div>
      <div class="panel-body">
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="collapse" id="ctx-collapse"></div>
      </div>
    </div>
  </section>

  <!-- ======== RIGHT COLUMN ======== -->
  <section>
    <!-- LIVE FEED -->
    <div class="panel">
      <div class="panel-header"><span>📡 LIVE AGENT FEED</span><span class="hint">SSE</span></div>
      <div class="panel-body">
        <div id="feed" class="feed"></div>
        <div id="feed-summary" class="feed-summary" style="display:none"></div>
      </div>
    </div>

    <!-- TARGETS -->
    <div class="panel">
      <div class="panel-header"><span>🎯 AUTHORIZED TARGETS</span></div>
      <div class="panel-body"><div id="targets" class="chip-list"></div></div>
    </div>

    <!-- TOOL REGISTRY -->
    <div class="panel">
      <div class="panel-header"><span>🧰 TOOL REGISTRY</span></div>
      <div class="panel-body"><div id="tools" class="chip-list"></div></div>
    </div>

    <!-- MODELS -->
    <div class="panel">
      <div class="panel-header"><span>🧬 MODEL REGISTRY</span></div>
      <div class="panel-body"><div id="models" class="chip-list"></div></div>
    </div>

    <!-- FINDINGS -->
    <div class="panel">
      <div class="panel-header"><span>📋 FINDINGS</span></div>
      <div class="panel-body"><div id="findings" class="history-list"></div></div>
    </div>
  </section>
</main>
</div>

<script>
"use strict";
/* =========================================================
   CERBERUS Command Deck — dark cyber front-end controller
   All dynamic strings written via textContent (no HTML escaping).
   ========================================================= */
const $ = (id) => document.getElementById(id);

const AGENT_ICONS = {
  planner: "🧠", researcher: "🔍", recon: "🛰️", analyst: "📊",
  coder: "💻", verifier: "✅", reporter: "📋"
};
const AGENT_ROLES = {
  planner: "Mission planning", researcher: "Threat intelligence", recon: "Network discovery",
  analyst: "Pattern analysis", coder: "Exploit / PoC", verifier: "Evidence validation",
  reporter: "Report generation"
};

let agents = [];
let running = false;

/* ---------- Feed ---------- */
function addFeed(kind, label, text, icon) {
  const feed = $("feed");
  const el = document.createElement("div");
  el.className = "feed-msg " + kind;
  const iconSpan = document.createElement("span");
  iconSpan.className = "icon";
  iconSpan.textContent = icon || "▸";
  const txtSpan = document.createElement("span");
  txtSpan.className = "txt";
  const lbl = document.createElement("span");
  lbl.className = "lbl";
  lbl.textContent = label;
  txtSpan.appendChild(lbl);
  txtSpan.appendChild(document.createTextNode(" " + String(text == null ? "" : text)));
  const ts = document.createElement("span");
  ts.className = "ts";
  ts.textContent = new Date().toLocaleTimeString();
  el.appendChild(iconSpan); el.appendChild(txtSpan); el.appendChild(ts);
  feed.appendChild(el);
  feed.scrollTop = feed.scrollHeight;
  while (feed.children.length > 80) feed.removeChild(feed.firstChild);
}
function addSummary(text) {
  const box = $("feed-summary");
  box.style.display = "block";
  box.textContent = text;
}

/* ---------- Roster ---------- */
function renderRoster() {
  const box = $("roster");
  box.textContent = "";
  agents.forEach((a) => {
    const card = document.createElement("div");
    card.className = "agent-card";
    card.id = "agent-" + a.name;
    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = AGENT_ICONS[a.name] || a.icon || "🤖";
    const info = document.createElement("span");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = a.name;
    const br = document.createElement("br");
    const role = document.createElement("span");
    role.className = "role";
    role.textContent = AGENT_ROLES[a.name] || a.role || "";
    info.appendChild(name); info.appendChild(br); info.appendChild(role);
    card.appendChild(icon); card.appendChild(info);
    box.appendChild(card);
  });
}
function setAgentActive(name, active) {
  const c = $("agent-" + name);
  if (!c) return;
  c.classList.toggle("active", active);
  if (active) c.classList.remove("done");
}
function setAgentDone(name) {
  const c = $("agent-" + name);
  if (!c) return;
  c.classList.remove("active");
  c.classList.add("done");
}
function countActive() {
  let n = 0;
  agents.forEach((a) => {
    const c = $("agent-" + a.name);
    if (c && c.classList.contains("active")) n += 1;
  });
  $("active-count").textContent = n + " ACTIVE";
}

/* ---------- SSE ---------- */
function connectEvents() {
  const es = new EventSource("/api/realtime");
  es.addEventListener("ready", () => addFeed("ready", "LINK", "telemetry channel open", "🔗"));
  es.addEventListener("task_started", (ev) => {
    const d = JSON.parse(ev.data).data;
    running = true;
    $("btn-launch").disabled = true;
    $("btn-stop").disabled = false;
    addFeed("task_started", "TASK", d.objective || "", "🚀");
  });
  es.addEventListener("plan_ready", (ev) => {
    const d = JSON.parse(ev.data).data;
    const steps = (d.steps || []).map((s) => s.step + "." + (s.action || "?")).join("  ");
    addFeed("plan_ready", "PLAN", steps, "🗺️");
  });
  es.addEventListener("phase", (ev) => {
    const d = JSON.parse(ev.data).data;
    addFeed("phase", (d.phase || "PHASE").toUpperCase(), d.message || "", "⚙️");
  });
  es.addEventListener("agent_started", (ev) => {
    const d = JSON.parse(ev.data).data;
    setAgentActive(d.agent, true);
    countActive();
    addFeed("agent_started", "AGENT " + String(d.agent || "").toUpperCase(),
      "engaging capability " + (d.capability || "unknown"), AGENT_ICONS[d.agent] || "🤖");
  });
  es.addEventListener("agent_completed", (ev) => {
    const d = JSON.parse(ev.data).data;
    setAgentDone(d.agent);
    countActive();
    const ok = d.success ? "OK" : "FAIL";
    let text = String(d.summary || "");
    if (d.latency_ms) text += " (" + d.latency_ms + "ms)";
    addFeed("agent_completed", "AGENT " + String(d.agent || "").toUpperCase() + " " + ok,
      text, AGENT_ICONS[d.agent] || "🤖");
  });
  es.addEventListener("task_completed", (ev) => {
    const d = JSON.parse(ev.data).data;
    setFinished();
    addFeed("task_completed", "COMPLETE",
      d.findings_count + " findings · " + (d.agents_used || []).join(", "), "🏁");
  });
  es.addEventListener("task_result", (ev) => {
    const d = JSON.parse(ev.data).data;
    addSummary(d.summary || "");
  });
  es.addEventListener("task_error", (ev) => {
    const d = JSON.parse(ev.data).data;
    setFinished();
    addFeed("task_error", "ERROR", d.error || "", "⛔");
  });
}
function setFinished() {
  running = false;
  $("btn-launch").disabled = false;
  $("btn-stop").disabled = true;
}

/* ---------- Launch ---------- */
async function launchTask() {
  const objective = $("objective").value.trim();
  if (!objective) {
    addFeed("task_error", "INPUT", "Enter an objective first.", "⚠️");
    $("objective").focus();
    return;
  }
  if (running) return;
  try {
    await fetch("/api/tasks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        objective: objective,
        simulate: $("simulate").checked,
        target_id: $("target-select").value || null
      })
    });
  } catch (e) {
    addFeed("task_error", "LAUNCH", e.message, "⛔");
  }
}

/* ---------- Command box ---------- */
$("cmd-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("cmd-input").value.trim();
  if (!msg) return;
  try {
    const resp = await fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg })
    });
    const data = await resp.json();
    const reply = $("cmd-reply");
    reply.textContent = "> " + msg + "\n\n" + (data.reply || "");
    reply.classList.add("show");
    $("cmd-input").value = "";
  } catch (err) {
    addFeed("task_error", "CMD", err.message, "⛔");
  }
});

/* ---------- Stop ---------- */
$("btn-stop").addEventListener("click", () => {
  addFeed("ready", "STOP", "manual stop requested", "🛑");
  setFinished();
});

/* ---------- Bootstrap ---------- */
async function bootstrap() {
  try {
    const resp = await fetch("/api/bootstrap");
    const data = await resp.json();
    agents = data.agents || [];
    renderRoster();
    $("stat-agents").textContent = agents.length;
    const targets = data.targets || [];
    $("stat-targets").textContent = targets.length;
    const tools = data.tools || [];
    $("stat-tools").textContent = tools.length;
    const mem = (data.memory || {}).total || 0;
    $("stat-memory").textContent = mem;

    const sel = $("target-select");
    const chips = $("targets");
    targets.forEach((t) => {
      const opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.id + " — " + (t.description || "");
      sel.appendChild(opt);
      const chip = document.createElement("span");
      chip.className = "chip allow";
      chip.textContent = t.id;
      chip.title = t.description || "";
      chips.appendChild(chip);
    });
    if (!targets.length) {
      const none = document.createElement("span");
      none.className = "chip deny";
      none.textContent = "none registered";
      chips.appendChild(none);
    }

    const toolsBox = $("tools");
    tools.forEach((t) => {
      const chip = document.createElement("span");
      chip.className = "chip tool-chip";
      chip.textContent = t;
      toolsBox.appendChild(chip);
    });

    const modelsBox = $("models");
    (data.models || []).forEach((m) => {
      const chip = document.createElement("span");
      chip.className = "chip model-chip";
      chip.textContent = (m.alias || m.model || "?") + " · " + String(m.status || "").split("_").join(" ");
      chip.title = "provider: " + (m.provider || "?") + " — model: " + (m.model || "?");
      modelsBox.appendChild(chip);
    });

    const findingsBox = $("findings");
    (data.findings || []).forEach((f) => {
      const el = document.createElement("div");
      el.className = "hist-item";
      const hdr = document.createElement("div");
      hdr.className = "hdr";
      const s = document.createElement("span");
      s.textContent = String(f.status || "").toUpperCase();
      const t = document.createElement("span");
      t.textContent = new Date(f.timestamp || Date.now()).toLocaleString();
      hdr.appendChild(s); hdr.appendChild(t);
      const body = document.createElement("div");
      body.textContent = String(f.observation || "").slice(0, 180);
      el.appendChild(hdr); el.appendChild(body);
      findingsBox.appendChild(el);
    });
    if (!(data.findings || []).length) {
      const none = document.createElement("span");
      none.className = "chip deny";
      none.textContent = "no findings yet";
      findingsBox.appendChild(none);
    }
    $("status-text").textContent = "ONLINE";
  } catch (e) {
    addFeed("task_error", "BOOT", e.message, "⛔");
  }
}

/* ---------- AI Context ---------- */
function addKpi(label, value) {
  const box = $("kpi-grid");
  const el = document.createElement("div");
  el.className = "kpi";
  const k = document.createElement("div");
  k.className = "k";
  k.textContent = label;
  const v = document.createElement("div");
  v.className = "v";
  v.textContent = value;
  el.appendChild(k); el.appendChild(v);
  box.appendChild(el);
}
function addCtxSection(title, bodyNode) {
  const box = $("ctx-collapse");
  const det = document.createElement("details");
  const sum = document.createElement("summary");
  sum.textContent = title;
  const inner = document.createElement("div");
  inner.className = "inner";
  inner.appendChild(bodyNode);
  det.appendChild(sum); det.appendChild(inner);
  box.appendChild(det);
}
function kvRow(k, v) {
  const row = document.createElement("div");
  row.className = "kv";
  const kk = document.createElement("span");
  kk.className = "k";
  kk.textContent = k;
  const vv = document.createElement("span");
  vv.className = "v";
  vv.textContent = String(v == null ? "—" : v).slice(0, 400);
  row.appendChild(kk); row.appendChild(vv);
  return row;
}
async function loadContext() {
  try {
    const resp = await fetch("/api/context");
    const ctx = await resp.json();

    // KPIs
    const evo = ctx.evolution || {};
    const evoStats = evo.stats || evo.generations || {};
    addKpi("EVOLUTION STATE", evo.is_running ? "ACTIVE" : (evo.initialized ? "READY" : "IDLE"));
    addKpi("GENERATIONS", evoStats.generation || evo.generations || "—");
    addKpi("CAPABILITIES", Object.keys(ctx.capabilities || {}).length || "—");
    $("stat-caps").textContent = Object.keys(ctx.capabilities || {}).length || 0;
    const perf = ctx.performance || {};
    const agentCalls = Object.values(perf.agents || {}).reduce((a, e) => a + Object.keys(e).length, 0);
    addKpi("TRACKED ENTITIES", agentCalls || "—");
    addKpi("SESSIONS", (ctx.sessions || []).length || "—");
    const oh = (ctx.llm_health || {}).ollama || {};
    addKpi("OLLAMA", oh.status || "UNKNOWN");

    // Capabilities list
    const caps = ctx.capabilities || {};
    const capNames = Object.keys(caps);
    if (capNames.length) {
      const list = document.createElement("div");
      list.className = "ctx-list";
      capNames.slice(0, 40).forEach((c) => {
        const row = document.createElement("div");
        row.className = "ctx-item";
        const k = document.createElement("span");
        k.className = "k";
        k.textContent = c;
        const v = document.createElement("span");
        v.className = "v";
        const provs = (caps[c] || []).map((p) => p.name).join(", ");
        v.textContent = provs || "—";
        row.appendChild(k); row.appendChild(v);
        list.appendChild(row);
      });
      addCtxSection("CAPABILITY ROUTING MAP", list);
    }

    // Evolution detail
    const evoKeys = Object.keys(evo).filter((k) => !["stats", "to_dict"].includes(k));
    if (evoKeys.length) {
      const list = document.createElement("div");
      evoKeys.slice(0, 20).forEach((k) => list.appendChild(kvRow(k, evo[k])));
      addCtxSection("EVOLUTION ENGINE", list);
    }

    // Performance detail
    if (perf.agents && Object.keys(perf.agents).length) {
      const list = document.createElement("div");
      Object.keys(perf.agents).forEach((name) => {
        const tasks = Object.keys(perf.agents[name] || {});
        tasks.forEach((t) => {
          const stat = perf.agents[name][t];
          const v = "calls=" + stat.calls + " success=" + Math.round((stat.success_rate || 0) * 100) + "%";
          list.appendChild(kvRow("agent:" + name + "/" + t, v));
        });
      });
      addCtxSection("AGENT PERFORMANCE", list);
    }
    if (perf.models && Object.keys(perf.models).length) {
      const list = document.createElement("div");
      Object.keys(perf.models).forEach((name) => {
        const tasks = Object.keys(perf.models[name] || {});
        tasks.forEach((t) => {
          const stat = perf.models[name][t];
          list.appendChild(kvRow("model:" + name + "/" + t,
            "calls=" + stat.calls + " latency=" + (stat.avg_latency || 0).toFixed(2) + "s"));
        });
      });
      addCtxSection("MODEL PERFORMANCE", list);
    }
  } catch (e) {
    addFeed("task_error", "CTX", e.message, "⛔");
  }
}

/* ---------- Init ---------- */
$("btn-launch").addEventListener("click", launchTask);
connectEvents();
bootstrap();
loadContext();
</script>
</body>
</html>
