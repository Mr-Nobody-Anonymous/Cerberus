# Dependabot — automated dependency updates.
# Root ecosystem updates the core package; adapters/ and infrastructure/ are
# vendored third-party trees and are excluded from update PRs.

version: 2
updates:
  # Core Python package (pyproject.toml + requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "bandit*"
          - "pip-audit"
      api-dependencies:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
