[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberai"
version = "2.0.0"
description = "Self-evolving multi-agent cyber AI security research orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mr-Nobody-Anonymous" },
]
keywords = ["cybersecurity", "ai", "orchestrator", "security-research", "pentesting", "evolution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0,<9",
    "PyYAML>=6.0,<7",
    "httpx>=0.24.0,<1",
    # Adapter runtime deps — drakben.py and guardian-cli's cli/ import these
    # at module level; without them the real adapters crash on subprocess exec.
    "python-dotenv>=1.0,<2",
    "rich>=13,<16",
    "typer>=0.9,<1",
    "prompt-toolkit>=3.0.38,<4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.160.0,<1",
    "uvicorn>=0.54.0,<1",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.23.0,<2",
    "pytest-cov>=4.1.0,<8",
    "ruff>=0.8.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
]
cloud = [
    # NOTE: The LLM gateway talks to OpenAI/Anthropic over raw httpx — these
    # SDKs are not imported anywhere and were removed as dead requirements.
    # Re-add only if an SDK-based provider transport is introduced.
]
all = [
    "fastapi>=0.160.0,<1",
    "uvicorn>=0.54.0,<1",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.23.0,<2",
    "pytest-cov>=4.1.0,<8",
    "ruff>=0.8.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
cyber-ai = "cyberai.orchestrator.cli.cli:cli"

[tool.setuptools.packages.find]
include = ["cyberai*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md", "*.html", "*.css", "*.js", "*.svg", "*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    # Vendored adapter codebases — they carry their own lint configs
    "adapters",
    "projects",
    "infrastructure",
    "cyberai/ui/frontend",
    "_cerberus-clean-check",
    "_ci_check",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # bugbear (real bug patterns)
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter where possible; long strings allowed
    "B008",  # function call in default arg — used for Rich console/theme singletons
    "SIM108", # ternary rewrite hurts readability in some cases
    "RUF012", # mutable class attrs — dataclass-style patterns used widely
    # Intentional unicode: box-drawing/arrow glyphs in CLI banners and tables
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["cyberai"]

[tool.ruff.lint.per-file-ignores]
# Tests: unused fixtures/imports are common; star imports in test helpers
"tests/**" = ["F401", "F403", "SIM117"]

[tool.coverage.run]
source = ["cyberai"]
omit = [
    # UI static assets
    "cyberai/ui/static/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]