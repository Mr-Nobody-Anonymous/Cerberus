[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberai"
version = "2.0.0"
description = "Self-evolving multi-agent cyber AI security research orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mr-Nobody-Anonymous" },
]
keywords = ["cybersecurity", "ai", "orchestrator", "security-research", "pentesting", "evolution"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0,<9",
    "PyYAML>=6.0,<7",
    "httpx>=0.24.0,<1",
    # Adapter runtime deps — drakben.py and guardian-cli's cli/ import these
    # at module level; without them the real adapters crash on subprocess exec.
    "python-dotenv>=1.0,<2",
    "rich>=13,<16",
    "typer>=0.9,<1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.104.0,<1",
    "uvicorn>=0.24.0,<1",
]
dev = [
    "pytest>=7.4.0,<9",
    "pytest-asyncio>=0.23.0,<1",
]
cloud = [
    # NOTE: The LLM gateway talks to OpenAI/Anthropic over raw httpx — these
    # SDKs are not imported anywhere and were removed as dead requirements.
    # Re-add only if an SDK-based provider transport is introduced.
]
all = [
    "fastapi>=0.104.0,<1",
    "uvicorn>=0.24.0,<1",
    "pytest>=7.4.0,<9",
    "pytest-asyncio>=0.23.0,<1",
]

[project.scripts]
cyber-ai = "cyberai.orchestrator.cli.cli:cli"

[tool.setuptools.packages.find]
include = ["cyberai*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["cyberai"]
omit = [
    # Vendored third-party code — not ours to measure
    "cyberai/llm_gateway/litellm/*",
    # UI static assets
    "cyberai/ui/static/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]